events {
    worker_connections 1024;
}

http {
    # Ẩn phiên bản Nginx để tăng bảo mật (Hardening)
    server_tokens off;

    # Chuyển hướng toàn bộ HTTP sang HTTPS
    server {
        listen 80;
        server_name localhost;

        # Endpoint nội bộ cho nginx-exporter thu thập metrics ở Bước 2
        location /stub_status {
            stub_status on;
            access_log off;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Máy chủ HTTPS Reverse Proxy chính
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers cơ bản (Yêu cầu mục 3 & 6)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://blog-app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
